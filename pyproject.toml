[project]
name = "fuzzytv"
version = "0.0.1"
description = "Fuzzy lookups for TVCache via canonicalization and relevant-state tracking"
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
